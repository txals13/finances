        (n?" ("+n+" canviada"+(n===1?"":"es")+")":""));
    }],
  ]);
}

/* ================================================================== *
 *  Escriptura d'.xlsx                                                 *
 *  Sense llibreries, com els lectors. Un xlsx és un ZIP amb uns quants *
 *  XML; s'hi guarda sense comprimir (mètode 0), que estalvia haver     *
 *  d'implementar deflate i els fitxers són de quatre files.            *
 * ================================================================== */
const CRC_T=(()=>{const t=new Uint32Array(256);
  for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[i]=c>>>0;}
  return t;})();
function crc32(u8){
  let c=0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c=CRC_T[(c^u8[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
/** ZIP sense compressió a partir de {ruta: text}. */
function zip(files){
  const enc=new TextEncoder(), parts=[], dir=[];
  let off=0;
  const u16=v=>[v&255,(v>>8)&255];
  const u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>24)&255];
  for(const [nom,txt] of Object.entries(files)){
    const dades=enc.encode(txt), nomB=enc.encode(nom), c=crc32(dades);
    const local=[...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(c),...u32(dades.length),...u32(dades.length),...u16(nomB.length),...u16(0)];
    parts.push(new Uint8Array(local),nomB,dades);
    dir.push([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(c),...u32(dades.length),...u32(dades.length),...u16(nomB.length),
      ...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)],nomB);
    off+=local.length+nomB.length+dades.length;
  }
  const cd=[]; let cdLen=0;
  for(let i=0;i<dir.length;i+=2){
    const a=new Uint8Array(dir[i]), b=dir[i+1];
    cd.push(a,b); cdLen+=a.length+b.length;
  }
  const n=Object.keys(files).length;
  cd.push(new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(n),...u16(n),
    ...u32(cdLen),...u32(off),...u16(0)]));
  return new Blob([...parts,...cd],
    {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
const xEsc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const colL=i=>{let s="";i++;while(i>0){const r=(i-1)%26;s=String.fromCharCode(65+r)+s;i=(i-r-1)/26;}return s;};
/** Data → número de sèrie d'Excel. */
const serial=iso=>Math.round((Date.parse(iso)-Date.UTC(1899,11,30))/86400000);

/** files = matriu; la primera és la capçalera. Les cel·les poden ser
    {d:"2025-01-31"} per a dates o {n:123.4} per a números. */
function xlsxBlob(files){
  const cells=files.map((fila,r)=>fila.map((v,c)=>{
    const ref=colL(c)+(r+1);
    if(v==null||v==="") return "";
    if(typeof v==="object"&&v.d!=null) return `<c r="${ref}" s="1"><v>${serial(v.d)}</v></c>`;
    if(typeof v==="object"&&v.n!=null) return `<c r="${ref}"><v>${v.n}</v></c>`;
    if(typeof v==="number") return `<c r="${ref}"><v>${v}</v></c>`;
    return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xEsc(v)}</t></is></c>`;
  }).join(""));
  const rows=cells.map((c,i)=>`<row r="${i+1}">${c}</row>`).join("");
  const ncol=Math.max(...files.map(f=>f.length));
  const dim=`A1:${colL(ncol-1)}${files.length}`;
  return zip({
    "[Content_Types].xml":`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`+
      `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">`+
      `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>`+
      `<Default Extension="xml" ContentType="application/xml"/>`+
      `<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>`+
      `<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`+
      `<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>`+
      `</Types>`,
    "_rels/.rels":`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`+
      `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`+
      `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>`+
      `</Relationships>`,
    "xl/workbook.xml":`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`+
      `<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" `+
      `xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">`+
      `<sheets><sheet name="Sheet1" sheetId="1" r:id="rId1"/></sheets></workbook>`,
    "xl/_rels/workbook.xml.rels":`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`+
      `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`+
      `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>`+
      `<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>`+
      `</Relationships>`,
    "xl/styles.xml":`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`+
      `<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">`+
      `<numFmts count="1"><numFmt numFmtId="164" formatCode="dd/mm/yyyy"/></numFmts>`+
      `<fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts>`+
      `<fills count="1"><fill><patternFill patternType="none"/></fill></fills>`+
      `<borders count="1"><border/></borders>`+
      `<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>`+
      `<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>`+
      `<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs>`+
      `<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>`+
      `</styleSheet>`,
    "xl/worksheets/sheet1.xml":`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`+
      `<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">`+
      `<dimension ref="${dim}"/><sheetData>${rows}</sheetData></worksheet>`,
  });
}

/* ---- Importar taules de cartera (.xlsx) ---------------------------------
   Els fitxers carteraDDMmmAAAA.xlsx porten, per a cada actiu, l'aportat i el
   valor d'aquell dia. Importar-ne uns quants reconstrueix l'historial sencer,
   inclòs el de l'aportat, que del full de càlcul no es podia treure. */
const MES_CURT={gen:1,ene:1,feb:2,mar:3,abr:4,mai:5,may:5,jun:6,jul:7,ago:8,
  set:9,sep:9,oct:10,nov:11,des:12,dic:12};
/** Data a partir del nom: cartera28Ago2026.xlsx → 2026-08-28. */
function dataDelNom(nom){
  const m=nom.match(/(\d{1,2})\s*([a-zA-ZçÇàèéíòóúÀÈÉÍÒÓÚ]{3,10})\s*(20\d\d)/);
  if(!m) return null;
  const mes=MES_CURT[m[2].slice(0,3).toLowerCase()];
  if(!mes) return null;
  return m[3]+"-"+String(mes).padStart(2,"0")+"-"+String(+m[1]).padStart(2,"0");
}
const norm=s=>String(s??"").toLowerCase().normalize("NFD")
  .replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g," ").replace(/\s+/g," ").trim();
/** Busca una columna per qualsevol dels noms possibles, ignorant accents. */
function colIdxPer(cap,noms){
  const c=cap.map(norm);
  for(const n of noms){ const i=c.indexOf(norm(n)); if(i>=0) return i; }
  return -1;
}
/** Llegeix un fitxer de cartera i el deixa a punt, sense tocar res encara. */
async function llegeixCartera(file){
  const buf=await file.arrayBuffer();
  const cap4=new Uint8Array(buf,0,4);
  const fulls=(cap4[0]===0x50&&cap4[1]===0x4B)?await readXlsx(buf):await readXls(buf);
  const full=fulls.find(f=>f.name==="Sheet1")||fulls.sort((a,b)=>b.rows.length-a.rows.length)[0];
  const rows=full.rows;
  const iCap=rows.findIndex(r=>colIdxPer(r,["Actiu"])>=0 && colIdxPer(r,["Import"])>=0);
  if(iCap<0) throw new Error("no s'hi troba la capçalera (Actiu, Import, Últim…)");
  const cap=rows[iCap];
  const ix={classe:colIdxPer(cap,["Actiu"]),entitat:colIdxPer(cap,["Entitat"]),
    nom:colIdxPer(cap,["Comentari"]),isin:colIdxPer(cap,["ISIN / Ticker","ISIN","Ticker"]),
    inici:colIdxPer(cap,["Data Inici"]),aportat:colIdxPer(cap,["Import"]),
    valor:colIdxPer(cap,["Últim","Ultim","Valor actual"])};
  const linies=[];
  for(let r=iCap+1;r<rows.length;r++){
    const f=rows[r];
    const nom=String(f[ix.nom]??"").trim(), ent=String(f[ix.entitat]??"").trim();
    if(!nom && !ent) continue;
    linies.push({classe:String(f[ix.classe]??"").trim(), entitat:ent, nom,
      isin:String(f[ix.isin]??"").trim(), inici:toDate(f[ix.inici]),
      aportat:toNum(f[ix.aportat])??0, valor:toNum(f[ix.valor])??0});
  }
  return {file:file.name, date:dataDelNom(file.name), linies};
}
/** L'actiu de la cartera que correspon a una línia: primer per ISIN, després pel nom. */
function trobaActiu(l){
  if(l.isin){
    const a=S.data.assets.find(x=>x.isin && norm(x.isin)===norm(l.isin));
    if(a) return a;
  }
  return S.data.assets.find(x=>norm(x.entity)===norm(l.entitat) && norm(x.name)===norm(l.nom));
}
function importaCarteraDialog(){
  const inp=el("input",{type:"file",accept:".xlsx,.xls",multiple:true,style:"display:none"});
  const zona=el("div",{class:"drop"},
    "Arrossega-hi les taules de cartera (.xlsx). En pots posar unes quantes de cop.",
    el("div",{style:"margin-top:12px"},
      el("button",{class:"btn",onclick:()=>inp.click()},"…o tria-les")));
  const cos=el("div",{},zona,inp);
  const processa=async llista=>{
    const lots=[];
    for(const f of llista){
      try{ lots.push(await llegeixCartera(f)); }
      catch(e){ lots.push({file:f.name,error:e.message}); }
    }
    closeDialog(); previewCartera(lots);
  };
  inp.onchange=()=>{ if(inp.files.length) processa([...inp.files]); };
  zona.addEventListener("dragover",e=>{e.preventDefault();zona.classList.add("over");});
  zona.addEventListener("dragleave",()=>zona.classList.remove("over"));
  zona.addEventListener("drop",e=>{e.preventDefault();zona.classList.remove("over");
    if(e.dataTransfer.files.length) processa([...e.dataTransfer.files]);});
  dialog("Importar taules de cartera",cos,[["Cancel·lar","btn",closeDialog]]);
}
function previewCartera(lots){
  const bons=lots.filter(l=>!l.error);
  const dates=new Map();
  for(const l of bons){
    const inp=el("input",{type:"date",value:l.date||TODAY,
      onchange:e=>{ l.date=e.target.value; }});
    if(!l.date) l.date=TODAY;
    dates.set(l,inp);
  }
  const files=lots.map(l=>{
    if(l.error) return el("tr",{},el("td",{class:"wrap"},l.file),
      el("td",{colspan:4,class:"neg"},l.error));
    const cone=l.linies.filter(x=>trobaActiu(x)).length;
    const nous=l.linies.length-cone;
    const tot=l.linies.reduce((s,x)=>s+x.valor,0);
    return el("tr",{},
      el("td",{class:"wrap"},l.file),
      el("td",{},dates.get(l)),
      el("td",{class:"r num"},l.linies.length),
      el("td",{class:"r num "+(nous?"neg":"mut")},nous||"—"),
      el("td",{class:"r num"},eur0(tot)));
  });
  const totalNous=bons.reduce((s,l)=>s+l.linies.filter(x=>!trobaActiu(x)).length,0);
  // Actius que tens i que el fitxer no menciona. No es toquen: es queden amb
  // l'últim valor conegut i el total del dia els segueix comptant. Si n'has
  // venut un i l'has tret del full, el total quedaria inflat sense avisar.
  const ultim=bons.length?bons.slice().sort((a,b)=>a.date<b.date?-1:1).at(-1):null;
  const absents=ultim
    ? S.data.assets.filter(a=>!ultim.linies.some(li=>trobaActiu(li)===a))
    : [];
  dialog("Importar taules de cartera",el("div",{},
    el("p",{class:"note",style:"margin:0 0 12px"},
      "La data surt del nom del fitxer; si no s'endevina, o no és la bona, canvia-la aquí. "+
      "De cada fitxer s'agafa el valor i l'aportat de cada actiu, i el total del dia serà "+
      "la suma."),
    totalNous?el("div",{class:"warnbox"},
      totalNous+(totalNous===1?" línia no correspon":" línies no corresponen")+
      " a cap actiu que ja tinguis. Es crearan actius nous. Si havien de coincidir, "+
      "revisa'n l'ISIN o el nom abans de continuar."):null,
    absents.length?el("div",{class:"warnbox"},
      "El fitxer no diu res de "+absents.map(a=>a.entity+" "+a.name).join(", ")+". "+
      (absents.length===1?"Aquest actiu es queda":"Aquests actius es queden")+
      " amb l'últim valor que en sabies ("+eur0(absents.reduce((t,a)=>t+assetValue(a),0))+
      " en total), i el total del dia els seguirà comptant. Si ja no els tens, "+
      "posa'ls a 0 al full o esborra'ls de la cartera."):null,
    el("div",{class:"tw"},el("table",{},
      el("thead",{},el("tr",{},el("th",{},"Fitxer"),el("th",{},"Data"),
        el("th",{class:"r"},"Línies"),el("th",{class:"r"},"Nous"),el("th",{class:"r"},"Total"))),
      el("tbody",{},files))),
  ),[
    ["Cancel·lar","btn",closeDialog],
    [`Importar ${bons.length} ${bons.length===1?"fitxer":"fitxers"}`,"btn primary",()=>{
      let nSnap=0,nNous=0;
      for(const l of bons.slice().sort((a,b)=>a.date<b.date?-1:1)){
        for(const li of l.linies){
          let a=trobaActiu(li);
          if(!a){
            a={id:uid(),n:S.data.assets.length+1,class:li.classe||"Altres",
              entity:li.entitat,name:li.nom,isin:li.isin||null,start:li.inici||l.date,
              contributed:li.aportat,last:li.valor,include:true,wallet:null};
            S.data.assets.push(a); nNous++;
          }
          if(li.inici && !a.start) a.start=li.inici;
          a.contributed=li.aportat;          // l'aportat d'aquell dia
          setAssetValue(a,l.date,li.valor,li.aportat);
          nSnap++;
        }
        recomputeTotal(l.date,true);          // instantània completa: el total és la suma
      }
      markDirty(); closeDialog(); render();
      flash(nSnap+" valoracions importades"+(nNous?" i "+nNous+" actius nous":""));
    }],
  ]);
}

/* ---- l'export de la cartera, amb les columnes que espera l'app d'anàlisi ---- */
const MES3=["Gen","Feb","Mar","Abr","Mai","Jun","Jul","Ago","Set","Oct","Nov","Des"];
function exportaCartera(){
  const A=S.data.assets;
  if(!A.length){ alert("No hi ha cap actiu a la cartera."); return; }
  const files=[["#","Actiu","Entitat","Comentari","Data Inici","ISIN / Ticker","Import","Últim","Balanç"]];
  A.slice().sort((a,b)=>(a.n||0)-(b.n||0)).forEach((a,i)=>{
    const inv=a.contributed||0, val=assetValue(a);
    files.push([a.n||i+1, a.class||"", a.entity||"", a.name||"",
      a.start?{d:a.start}:"", a.isin||"", {n:inv}, {n:val}, {n:+(val-inv).toFixed(2)}]);
  });
  const d=new Date(TODAY);
  const nom="cartera"+String(d.getDate()).padStart(2,"0")+MES3[d.getMonth()]+d.getFullYear()+".xlsx";
  const url=URL.createObjectURL(xlsxBlob(files));
  const a=el("a",{href:url,download:nom});
  document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  flash(nom+" descarregat");
}

/* ================================================================== *
 *  Cartera                                                           *
 * ================================================================== */
/** Últim valor conegut d'un actiu: la valoració més recent, o el camp `last`
    per als actius sense sèrie mensual, que són els il·líquids. */
function assetValue(a){
  let best=null;
  for(const s of S.data.snapshots)
    if(s.assetId===a.id && (!best||s.date>best.date)) best=s;
  return best ? best.value : (a.last||0);
}
function assetStats(a){
  const value=assetValue(a), inv=a.contributed||0;
  const gain=value-inv;
  const years=a.start ? Math.max(0,(Date.parse(TODAY)-Date.parse(a.start))/(365.25*86400000)) : 0;
  return { value, inv, gain,
    ret: inv>0 ? gain/inv : null,
    years,
    cagr: (inv>0 && value>0 && years>0.08) ? Math.pow(value/inv,1/years)-1 : null };
}
/** Etiquetes per a una sèrie de valoracions. Les valoracions es desen amb data
    sencera, no per mes: importar una cartera n'afegeix una del dia que sigui.
    Si en un mes n'hi ha més d'una i totes s'etiqueten "ago 26", el gràfic surt
    amb tres punts indistingibles i sembla trencat. Quan passa, aquell mes porta
    el dia al davant. */
function dateLabels(dates){
  const n=new Map();
  for(const d of dates){ const m=d.slice(0,7); n.set(m,(n.get(m)||0)+1); }
  return dates.map(d=>n.get(d.slice(0,7))>1
    ? (+d.slice(8,10))+" "+MESOS[+d.slice(5,7)-1]
    : mLabel(d.slice(0,7)));
}
/** Una valoració per mes: l'última de cada mes. El que es presenta com a
    mensual ho ha de ser: si no, dues valoracions del mateix agost compten com
    dos mesos i la variació entre elles, de tres dies, es llegeix com la del mes. */
function monthlySeries(){
  const m=new Map();
  for(const p of portfolioSeries()) m.set(p.date.slice(0,7),p);
  return [...m.values()];
}
function portfolioSeries(){
  const byDate=new Map();
  for(const t of (S.data.portfolioTotals||[])) byDate.set(t.date,t.total);
  const sums=new Map();
  for(const s of S.data.snapshots) sums.set(s.date,(sums.get(s.date)||0)+s.value);
  for(const [d,v] of sums) if(!byDate.has(d)) byDate.set(d,v);
  return [...byDate].sort((a,b)=>a[0]<b[0]?-1:1).map(([date,total])=>({date,total}));
}
/** Barres horitzontals: per a 6-13 categories es llegeix molt millor que un formatget. */
function breakdown(rows,total,color){
  if(!rows.length) return el("div",{class:"empty"},"Sense dades.");
  const max=Math.max(...rows.map(r=>r[1]));
  return el("div",{},rows.map(([k,v])=>el("div",{style:"margin-bottom:9px"},
    el("div",{style:"display:flex;justify-content:space-between;gap:12px;font-size:13px"},
      el("span",{},k),
      el("span",{class:"num mut"},eur(v)+"  ·  "+pct(total?v/total:0))),
    el("div",{style:"height:7px;border-radius:4px;background:var(--line);margin-top:3px"},
      el("div",{style:`height:7px;border-radius:4px;background:${color};width:${max?v/max*100:0}%`})),
  )));
}
function renderCartera(root){
  const A=S.data.assets;
  if(!A.length){ root.replaceChildren(el("div",{class:"card"},
    el("div",{class:"empty"},"Cap actiu a la cartera."))); return; }
  const st=new Map(A.map(a=>[a.id,assetStats(a)]));
  const value=A.reduce((s,a)=>s+st.get(a.id).value,0);
  const inv  =A.reduce((s,a)=>s+st.get(a.id).inv,0);
  const zero =A.filter(a=>st.get(a.id).value===0 && st.get(a.id).inv>0);
  const zInv =zero.reduce((s,a)=>s+st.get(a.id).inv,0);
  const live =A.filter(a=>!zero.includes(a));
  const lInv =live.reduce((s,a)=>s+st.get(a.id).inv,0);
  const lVal =live.reduce((s,a)=>s+st.get(a.id).value,0);
  const series=portfolioSeries();
  const lastDate=series.length?series[series.length-1].date:null;

  const group=key=>groupAssets(A,key)
    .map(g=>[g.label,g.assets.reduce((s,a)=>s+st.get(a.id).value,0)])
    .filter(([,v])=>v>0).sort((x,y)=>y[1]-x[1]);

  root.replaceChildren(
    el("div",{class:"grid kpis",style:"margin-bottom:14px"},
      kpi("Valor actual",eur(value),lastDate?"valorat el "+dCa(lastDate):""),
      kpi("Aportat",eur(inv),A.length+" actius"),
      kpi("Balanç",eur(value-inv),pct(inv?(value-inv)/inv:null),sgn(value-inv)),
      kpi("Balanç sense els il·líquids",eur(lVal-lInv),pct(lInv?(lVal-lInv)/lInv:null),sgn(lVal-lInv)),
      (()=>{const nd=new Set(S.data.snapshots.map(s=>s.date)).size;
        const nm=new Set(S.data.snapshots.map(s=>s.date.slice(0,7))).size;
        return kpi("Valoracions",NF0.format(nd),nm===nd?"mesos registrats":nm+" mesos registrats");})(),
    ),
    zero.length ? el("div",{class:"warnbox"},

/** Data de l'última valoració d'un actiu, o la d'avui si encara no en té cap. */
function lastSnapshotDate(a){
  let d=null;
  for(const s of S.data.snapshots) if(s.assetId===a.id && (!d||s.date>d)) d=s.date;
  return d;
}
/** Aportat d'un actiu en una data, o null si en aquell moment no se sabia.
    Es va provar de reconstruir-ho cap enrere restant les aportacions posteriors,
    però el registre d'aportacions heretat del full no quadra amb l'aportat total
    i en sortien xifres impossibles, com un aportat que puja com més enrere vas.
    Val més no ensenyar res que ensenyar una línia inventada. */
function assetCostAt(a,date){
  let base=null;
  for(const s of S.data.snapshots)
    if(s.assetId===a.id && s.cost!=null && s.date<=date && (!base||s.date>base.date)) base=s;
  if(!base) return null;
  let c=base.cost;
  for(const x of S.data.contributions)
    if(x.assetId===a.id && x.date>base.date && x.date<=date) c+=x.amount;
  return c;
}
/** Aportat de tota la cartera en una data. Només val si el sabem de TOTS els
    actius: sumar-ne uns quants dona una xifra que no es pot comparar amb la
    d'una altra data. Passava al 28/08/2026, on Hospitality i Renovables encara
    no tenien valoració: l'aportat sortia 128.972 € en comptes de 197.798 € i el
    balanç feia un salt de 68.826 € que no havia passat mai. */
function portfolioCostAt(date){
  const c=S.data.assets.map(a=>assetCostAt(a,date));
  return c.length && !c.some(v=>v==null) ? c.reduce((s,v)=>s+v,0) : null;
}
/** La primera data en què tenim l'aportat de tota la cartera, no d'uns quants. */
function firstCostDate(){
  for(const d of [...new Set(S.data.snapshots.map(s=>s.date))].sort())
    if(portfolioCostAt(d)!=null) return d;
  return null;
}
/** Valor d'un actiu tal com era en una data: l'última valoració que no la sobrepassa. */
function assetValueAt(a,date){
  let best=null;
  for(const s of S.data.snapshots)
    if(s.assetId===a.id && s.date<=date && (!best||s.date>best.date)) best=s;
  return best?best.value:0;
}
/** Escriu el valor d'un actiu a una data i mou el total d'aquell dia en la mateixa
    quantitat. Se suma la diferència en comptes de recalcular el total perquè els
    totals del 2025 venien escrits a mà i no són la suma de les valoracions.
    Si aquell dia encara no té total, el crea `ensureTotal` un cop escrits tots
    els actius: fer-ho aquí barrejaria valors nous i vells. */
function setAssetValue(a,date,value,cost){
  const eraUltima = date>=(lastSnapshotDate(a)||date);
  const i=S.data.snapshots.findIndex(s=>s.assetId===a.id && s.date===date);
  // Valor amb què aquell dia ja comptava l'actiu. Si no en tenia de propi, el que
  // se n'arrossegava de l'última valoració anterior — que és el que el total ja
  // reflectia. Posar-hi 0 sumava l'actiu sencer i inflava el total.
  const previ = i>=0 ? S.data.snapshots[i].value : assetValueAt(a,date);
  if(cost==null) cost=a.contributed||0;
  if(i>=0){ S.data.snapshots[i].value=value; S.data.snapshots[i].cost=cost; }
  else S.data.snapshots.push({date,assetId:a.id,value,cost});
  S.data.snapshots.sort((x,y)=>x.date<y.date?-1:1);
  if(eraUltima) a.last=value;
  const t=(S.data.portfolioTotals||[]).find(t=>t.date===date);
  if(t) t.total=Math.round((t.total+value-previ)*100)/100;
}
function ensureTotal(date){
  if((S.data.portfolioTotals||[]).some(t=>t.date===date)) return;
  S.data.portfolioTotals.push({date,
    total:Math.round(S.data.assets.reduce((s,x)=>s+assetValueAt(x,date),0)*100)/100});
  S.data.portfolioTotals.sort((x,y)=>x.date<y.date?-1:1);
}
/** Després d'una valoració de tota la cartera, el total d'aquell dia és la suma.
    Si aquell dia ja en tenia un d'apuntat i no s'assemblen, es pregunta: als mesos
    antics el total venia escrit a mà i incloïa actius que no desglossaves, o sigui
    que la suma pot ser molt més baixa sense que la xifra vella fos dolenta. */
function recomputeTotal(date,silenci){
  const total=Math.round(S.data.assets.reduce((s,x)=>s+assetValueAt(x,date),0)*100)/100;
  const t=(S.data.portfolioTotals||[]).find(t=>t.date===date);
  if(t){
    const dif=Math.abs(t.total-total), rel=t.total?dif/t.total:0;
    if(!silenci && dif>1 && rel>0.05 && !confirm(
      "Aquell dia hi tenies apuntat un total de "+eur(t.total)+", i la suma de les "+
      "valoracions que acabes de desar és "+eur(total)+". Si als mesos antics no "+
      "desglossaves tots els actius, la xifra vella pot ser la bona. "+
      "Vols substituir-la per "+eur(total)+"?")) return;
    t.total=total;
  }
  else{
    S.data.portfolioTotals.push({date,total});
    S.data.portfolioTotals.sort((x,y)=>x.date<y.date?-1:1);
  }
}

/** Gràfic d'àrees apilades: com s'ha repartit la cartera al llarg del temps. */
function areaChart(dates,series,{h=230,fmt=eur0}={}){
  const W=1000,P={t:12,r:60,b:22,l:8};
  const s=sv("svg",{viewBox:`0 0 ${W} ${h}`,class:"chart",preserveAspectRatio:"none"});
  if(!dates.length||!series.length) return s;
  const tot=dates.map((_,i)=>series.reduce((a,q)=>a+(q.values[i]||0),0));
  const hi=Math.max(1,...tot);
  const x=i=>P.l+i*(W-P.l-P.r)/Math.max(1,dates.length-1);
  const y=v=>P.t+(hi-v)*(h-P.t-P.b)/hi;
  for(let i=0;i<=4;i++){
    const v=hi*i/4, Y=y(v);
    s.append(sv("line",{x1:P.l,x2:W-P.r,y1:Y,y2:Y,stroke:"var(--line)","stroke-width":1}));
    const t=sv("text",{x:W-P.r+6,y:Y+3.5}); t.textContent=fmt(v); s.append(t);
  }
  const acum=new Array(dates.length).fill(0);
  for(const q of series){
    const baix=acum.slice();
    for(let i=0;i<dates.length;i++) acum[i]+=q.values[i]||0;
    const d=[...acum.map((v,i)=>(i?"L":"M")+x(i)+" "+y(v)),
             ...baix.map((v,i)=>"L"+x(dates.length-1-i)+" "+y(baix[dates.length-1-i]))].join(" ")+" Z";
    const path=sv("path",{d,fill:q.color,opacity:.85,stroke:"var(--panel)","stroke-width":.5});
    s.append(tip(path,q.label));
  }
  const step=Math.ceil(dates.length/12), et=dateLabels(dates);
  dates.forEach((d,i)=>{
    if(i%step===0||i===dates.length-1){
      const t=sv("text",{x:x(i),y:h-6,"text-anchor":"middle"});
      t.textContent=et[i]; s.append(t);
    }
  });
  return s;
}
/** Diverses línies al mateix gràfic, per comparar sèries. */
function linesChart(labels,series,{h=200,fmt=eur0}={}){
  const W=1000,P={t:12,r:62,b:22,l:8};
  const s=sv("svg",{viewBox:`0 0 ${W} ${h}`,class:"chart",preserveAspectRatio:"none"});
  if(!labels.length) return s;
  const tots=series.flatMap(q=>q.values).filter(v=>v!=null);
  let lo=Math.min(0,...tots), hi=Math.max(...tots); if(hi===lo) hi=lo+1;
  const x=i=>P.l+i*(W-P.l-P.r)/Math.max(1,labels.length-1);
  const y=v=>P.t+(hi-v)*(h-P.t-P.b)/(hi-lo);
  for(let i=0;i<=4;i++){
    const v=lo+(hi-lo)*i/4, Y=y(v);
    s.append(sv("line",{x1:P.l,x2:W-P.r,y1:Y,y2:Y,stroke:"var(--line)","stroke-width":1}));
    const t=sv("text",{x:W-P.r+6,y:Y+3.5}); t.textContent=fmt(v); s.append(t);
  }
  for(const q of series){
    const d=q.values.map((v,i)=>(i?"L":"M")+x(i)+" "+y(v)).join(" ");
    s.append(sv("path",{d,fill:"none",stroke:q.color,"stroke-width":2,
      "stroke-dasharray":q.dash||null,"stroke-linejoin":"round","stroke-linecap":"round"}));
    q.values.forEach((v,i)=>{
      const c=sv("circle",{cx:x(i),cy:y(v),r:2.2,fill:q.color,opacity:.9});
      s.append(tip(c,`${labels[i]} · ${q.label}: ${fmt(v)}`));
    });
  }
  const step=Math.ceil(labels.length/12);
  labels.forEach((l,i)=>{
    if(i%step===0||i===labels.length-1){
      const t=sv("text",{x:x(i),y:h-6,"text-anchor":"middle"}); t.textContent=l; s.append(t);
    }
  });
  return s;
}
const PALETA=["#2f6fed","#8b5cf6","#0f9d58","#e0a33e","#d93025","#0891b2","#db2777",
              "#65a30d","#7c3aed","#ea580c","#0d9488","#a16207","#9333ea"];

/** Les dates on hi ha valoracions, dins del període triat. */
function snapshotDates(){
  const [a,b]=periodRange();
  return [...new Set(S.data.snapshots.map(s=>s.date))].sort()
    .filter(d=>d>=a&&d<=b);
}
/** Agrupa ignorant majúscules i etiqueta amb la grafia més repetida: al full
    hi ha "MyInvestor" i "Myinvestor", i si no, surten com dues entitats. */
function groupAssets(A,key){
  const m=new Map();
  for(const a of A){
    const raw=a[key]||"—", k=String(raw).toLowerCase().trim();
    let g=m.get(k);
    if(!g) m.set(k,g={label:raw,noms:new Map(),assets:[]});
    g.assets.push(a);
    g.noms.set(raw,(g.noms.get(raw)||0)+1);
  }
  for(const g of m.values())
    g.label=[...g.noms].sort((a,b)=>b[1]-a[1])[0][0];
  return [...m].map(([k,g])=>({key:k,label:g.label,assets:g.assets}));
}
function renderEvolucio(){
  const dates=snapshotDates();
  if(dates.length<2) return el("div",{class:"card"},el("h2",{},"Evolució"),
    el("div",{class:"empty"},"Calen almenys dues valoracions dins del període."));
  const A=S.data.assets;
  const modes=[["class","Per classe d'actiu"],["entity","Per entitat"],["asset","Per actiu"]];
  const mode=S.cartera.evol;

  let grups;
  grups = mode==="asset"
    ? A.map(a=>({key:a.id,label:a.entity+" · "+a.name,assets:[a]}))
    : groupAssets(A,mode);
  const series=grups.map((g,i)=>({label:g.label,color:PALETA[i%PALETA.length],
    values:dates.map(d=>g.assets.reduce((s,a)=>s+assetValueAt(a,d),0))}))
    .filter(q=>q.values.some(v=>v>0));
  series.sort((a,b)=>b.values.at(-1)-a.values.at(-1));

  const totals=dates.map((d,i)=>series.reduce((s,q)=>s+q.values[i],0));
  const primer=totals[0], ultim=totals.at(-1);

  return el("div",{class:"card"},
    el("div",{class:"bar",style:"margin:0 0 12px"},
      el("h2",{style:"margin:0;flex:1"},"Com s'ha repartit la cartera"),
      sel(mode,modes,v=>{S.cartera.evol=v;render();})),
    areaChart(dates,series),
    el("div",{class:"legend"},series.map(q=>el("span",{},
      el("i",{style:"background:"+q.color}),q.label+" · "+eur0(q.values.at(-1))))),
    (()=>{
      // Als primers mesos el total escrit a mà del full era més alt que la suma de
      // valoracions per actiu, perquè encara no les portava totes. Val més dir-ho

/* ================================================================== *
 *  Independència financera                                            *
 *  El model és el de independencia_v33.html: tres fases, objectiu     *
 *  Coast FIRE descomptat des del capital dels 60, i tres maneres de   *
 *  retirar. La diferència és que aquí el capital, el cost d'adquisició *
 *  i els saldos de liquiditat surten de les dades reals, no d'inputs. *
 * ================================================================== */
/* Valors de sortida neutres. Els de debò viuen al fitxer de dades, no al codi:
   aquest fitxer es pot publicar i no ha de dir res de ningú. */
const ARA=new Date().getFullYear();
const FIRE_DEF={ year:ARA+5, monthly:1000, rate:6, surplus:0,
  fase2Annual:0, fase3Year:ARA+15, ageNow:45, ageFire:65, income:1500,
  inflation:2.5, retRate:4, lifespan:90, model:"hybrid", liquidity:null };

/** Valor futur amb aportacions mensuals. */
function projectValue(start,monthly,annualRate,months){
  const r=annualRate/100/12;
  if(r===0) return start+monthly*months;
  return start*Math.pow(1+r,months)+monthly*(Math.pow(1+r,months)-1)/r;
}
/** Impost de l'estalvi sobre el guany anual (trams estatals). */
function calcTax(gain){
  if(gain<=0) return 0;
  const trams=[[6000,.19],[50000,.21],[200000,.23],[300000,.27],[Infinity,.28]];
  let t=0,rest=gain,prev=0;
  for(const [limit,rate] of trams){
    const tros=Math.min(rest,limit-prev);
    if(tros<=0) break;
    t+=tros*rate; rest-=tros; prev=limit;
    if(rest<=0) break;
  }
  return t;
}
/** Capital i cost d'adquisició reals, de la cartera. */
function fireCapital(){
  const A=S.data.assets;
  return { value:A.reduce((s,a)=>s+assetValue(a),0),
           cost: A.reduce((s,a)=>s+(a.contributed||0),0) };
}
/** Mitjanes mensuals mesurades: el que de debò estalvies i inverteixes. */
function fireMeasured(){
  const rows=derive().filter(r=>!r.future&&r.nMov);
  const w=rows.slice(-12);
  if(!w.length) return {saving:null,invest:null,n:0};
  return { saving:w.reduce((a,r)=>a+r.saving,0)/w.length,
           invest:w.reduce((a,r)=>a+r.invest,0)/w.length, n:w.length };
}

function fireModel(){
  const f=S.data.fire, cap=fireCapital();
  const now=new Date(TODAY), currentYear=now.getFullYear();
  const monthly=(+f.monthly||0)+(+f.surplus||0);
  const rate=+f.rate||0, inflation=+f.inflation||0;
  const retRate=(+f.retRate||0)/100;
  const ageNow=+f.ageNow||0, ageFire=+f.ageFire||0, lifespan=+f.lifespan||0;
  const income=+f.income||0, fase2Annual=+f.fase2Annual||0;
  const coastYear=+f.year||currentYear, fase3Year=+f.fase3Year||currentYear;

  /* --- objectiu Coast FIRE ---
     capital necessari a la fase 3 = renda anual / taxa de retirada, descomptat
     enrere fins l'any de coast amb compost mensual, restant-hi abans el valor
     futur de les aportacions de la fase 2. */
  const annualIncomeNeeded=income*12;
  const capitalAtFireComplete=retRate>0?annualIncomeNeeded/retRate:annualIncomeNeeded*25;
  const monthsCoastToFire=Math.max(0,(fase3Year-coastYear)*12);
  const r=rate/100/12;
  let goal;
  if(monthsCoastToFire===0) goal=capitalAtFireComplete;
  else if(r===0) goal=capitalAtFireComplete-(fase2Annual/12)*monthsCoastToFire;
  else {
    const fvFase2=(fase2Annual/12)*((Math.pow(1+r,monthsCoastToFire)-1)/r);
    goal=(capitalAtFireComplete-fvFase2)/Math.pow(1+r,monthsCoastToFire);
  }

  /* --- projecció real --- */
  const monthsToCoast=Math.max(1,Math.round((new Date(coastYear,11,31)-now)/(86400000*30.44)));
  const capitalAtCoast=projectValue(cap.value,monthly,rate,monthsToCoast);
  const capitalAtFire =projectValue(capitalAtCoast,fase2Annual/12,rate,monthsCoastToFire);

  /* --- fracció que tributa: el cost creix nominal, el valor compost --- */
  const costAtFire=cap.cost+monthly*monthsToCoast+(fase2Annual/12)*monthsCoastToFire;
  const gainFraction=capitalAtFire>0
    ? Math.max(0,Math.min(1,1-costAtFire/capitalAtFire))
    : Math.max(0,Math.min(1,1-cap.cost/Math.max(cap.value,1)));

  /* --- renda: la neta objectiu, portada a euros del futur, i el brut que cal --- */
  const yearsToFire=Math.max(0,ageFire-ageNow);
  const incomeAtFire=income*Math.pow(1+inflation/100,yearsToFire);
  let grossAnnual=incomeAtFire*12;
  for(let i=0;i<25;i++){
    const net=grossAnnual-calcTax(grossAnnual*gainFraction);
    grossAnnual=grossAnnual*(incomeAtFire*12/Math.max(net,1));
  }
  const yearsRetirement=Math.max(1,lifespan-ageFire);
  let capitalNeeded,swr,annualWithdrawal;
  if(f.model==="growth"){
    swr=retRate; capitalNeeded=grossAnnual/(retRate||1); annualWithdrawal=capitalNeeded*retRate;
  } else if(f.model==="swr"){
    swr=0.04; annualWithdrawal=capitalAtFire*swr; capitalNeeded=grossAnnual/swr;
  } else {
    const n=yearsRetirement;
    const factor=retRate>0?(1-Math.pow(1+retRate,-n))/retRate:n;
    capitalNeeded=grossAnnual*factor; swr=retRate>0?1/factor:1/n;
    annualWithdrawal=capitalAtFire*swr;
  }
  const annualNet=annualWithdrawal-calcTax(annualWithdrawal*gainFraction);
  const monthlyNetFire=annualNet/12;
  const monthlyNetToday=monthlyNetFire/Math.pow(1+inflation/100,yearsToFire);

  /* --- quan s'arriba a l'objectiu al ritme d'ara --- */
  let mesos=null;
  if(cap.value<goal && monthly>0){
    let lo=0,hi=720;
    for(let i=0;i<60;i++){
      const mid=(lo+hi)/2;
      if(projectValue(cap.value,monthly,rate,mid)<goal) lo=mid; else hi=mid;
    }
    mesos=Math.ceil(hi);
  } else if(cap.value>=goal) mesos=0;

  return {goal,capital:cap.value,cost:cap.cost,monthly,rate,inflation,
    coastYear,fase3Year,ageNow,ageFire,lifespan,income,fase2Annual,retRate,
    capitalAtCoast,capitalAtFire,capitalNeeded,gainFraction,grossAnnual,
    swr,annualWithdrawal,monthlyNetFire,monthlyNetToday,mesos,
    monthsToCoast,monthsCoastToFire,yearsRetirement,model:f.model,
    progress:goal>0?cap.value/goal:null};
}

/** Capital any a any, de l'edat d'avui fins a l'esperança de vida.
    Es compta tot en mesos des d'avui i amb els mateixos trams que fireModel(),
    perquè si no el gràfic i els indicadors no donarien el mateix als 62. */
function fireSeries(M){
  const out=[];
  const rNom=M.retRate/12, inflR=M.inflation/100;
  const grossMonthly=M.grossAnnual/12;
  const mFire=M.monthsToCoast+M.monthsCoastToFire;
  // Un punt per any, més el moment exacte en què comença la renda: si no,
  // el gràfic saltaria per damunt d'aquell mes i no coincidiria amb el KPI.
  const punts=[];
  for(let a=M.ageNow;a<=M.lifespan;a++) punts.push((a-M.ageNow)*12);
  if(!punts.includes(mFire)) punts.push(mFire);
  punts.sort((a,b)=>a-b);
  for(const mesos of punts){
    const age=M.ageNow+mesos/12;
    let cap;
    if(mesos<=mFire){
      const mesosFase1=Math.min(mesos,M.monthsToCoast);
      const mesosFase2=Math.max(0,mesos-mesosFase1);
      const c1=projectValue(M.capital,M.monthly,M.rate,mesosFase1);
      cap=projectValue(c1,M.fase2Annual/12,M.rate,mesosFase2);
    } else {
      const mInto=mesos-mFire;
      if(M.model==="growth") cap=M.capitalAtFire*Math.pow(1+inflR,mInto/12);
      else {
        const pmt=M.model==="swr"?M.annualWithdrawal/12:grossMonthly;
        cap=Math.abs(rNom)<1e-5 ? M.capitalAtFire-pmt*mInto
          : M.capitalAtFire*Math.pow(1+rNom,mInto)-pmt*(Math.pow(1+rNom,mInto)-1)/rNom;
        cap=Math.max(0,cap);
      }
    }
    let renda=null;
    if(mesos>=mFire){
      const inf=Math.pow(1+inflR,age-M.ageNow);
      const draw=M.model==="growth"
        ? cap*Math.max(M.rate/100-inflR,0.01)/12
        : M.annualWithdrawal/12;
      const tax=calcTax(draw*12*M.gainFraction)/12;
      renda=Math.max(0,draw-tax)/inf;
    }
    out.push({age,label:String(Math.round(age)),cap:Math.round(cap),
      renda:renda==null?null:Math.round(renda),fire:mesos===mFire});
  }
  return out;
}

/** Ajunta el que ha passat de debò amb el que es projecta, en una sola línia. */
function fireCombined(M,serie){
  const anys=d=>(Date.parse(d)-Date.parse(TODAY))/(365.25*86400000);
  const real=(S.data.portfolioTotals||[])
    .filter(t=>t.date<=TODAY)
    .map(t=>({k:String(Math.round(M.ageNow+anys(t.date))),v:t.total,real:true}));
  const proj=serie.map(p=>({k:p.label,v:p.cap}));
  return {pts:[...real,...proj], split:real.length?real.length-1:null};
}

      el("p",{class:"note"},
        arribada
          ? (arribada.slice(0,4)<=String(M.coastYear)
              ? "Al ritme actual hi arribes el "+dCa(arribada)+", abans del "+M.coastYear+"."
              : "Al ritme actual hi arribes el "+dCa(arribada)+", "+
                plural(+arribada.slice(0,4)-M.coastYear,"any","anys")+" tard. Caldrien "+
                eur0(fireNeededMonthly(M))+" al mes per fer-ho el "+M.coastYear+".")
          : "Amb aportació 0 no s'hi arriba."),
    ),
    fireFases(M,anysFase1),
    card("El teu capital: el que ha passat i el que es projecta",
      (()=>{const c=fireCombined(M,serie);
        return lineChart(c.pts,{h:210,color:"var(--inv)",fmt:eur0,split:c.split});})(),
      el("p",{class:"note"},"El tram continu és real, tret de la teva pròpia cartera; "+
        "el discontinu és la projecció des d'avui. Per edat. Fase 1 fins als "+(M.ageNow+anysFase1)+
        " (aportant "+eur0(M.monthly)+"/mes), fase 2 fins als "+M.ageFire+
        " (aportant "+eur0(M.fase2Annual/12)+"/mes), i a partir d'aquí es retira."),
    ),
    card("Renda mensual neta, en euros d'avui",
      lineChart(serie.filter(p=>p.renda!=null).map(p=>({k:p.label,v:p.renda})),
        {h:170,color:"var(--pos)",fmt:eur0}),
      el("p",{class:"note"},"Descomptats impostos de l'estalvi sobre la part que és guany ("+
        pct(M.gainFraction)+" del capital als "+M.ageFire+") i la inflació del "+
        M.inflation+" %."),
    ),
    fireLiquidity(),
    fireParams(mes),
    fireHistory(),
  );
}
/** Quant caldria aportar cada mes per arribar a l'objectiu l'any previst. */
const plural=(n,u,us)=>n+" "+(n===1?u:us);
function fireNeededMonthly(M){
  const m=Math.max(1,M.monthsToCoast), r=M.rate/100/12;
  const fvCapital=M.capital*Math.pow(1+r,m);
  const falta=M.goal-fvCapital;
  if(falta<=0) return 0;
  return r===0 ? falta/m : falta*r/(Math.pow(1+r,m)-1);
}
function fireFases(M,anysFase1){
  const cell=(t,v,s)=>el("div",{},
    el("div",{class:"lbl",style:"font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)"},t),
    el("div",{style:"font-size:17px;font-weight:600;margin-top:3px"},v),
    s?el("div",{class:"sub",style:"font-size:12px;color:var(--muted)"},s):null);
  const fase=(n,titol,sub,cells)=>el("div",{class:"card",style:"margin:0"},
    el("h2",{style:"margin-bottom:4px"},"Fase "+n+" · "+titol),
    el("p",{class:"note",style:"margin:0 0 12px"},sub),
    el("div",{style:"display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px"},cells));
  return el("div",{class:"grid",style:"grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"},
    fase(1,"Acumulació",
      "Fins al "+M.coastYear+" ("+anysFase1+" anys), aportant cada mes.",
      [cell("Aportació",eur0(M.monthly)+"/mes"),
       cell("Capital al final",eur0(M.capitalAtCoast)),
       cell("Objectiu",eur0(M.goal),M.capitalAtCoast>=M.goal?"s'assoleix":"no s'assoleix")]),
    fase(2,"Coast",
      "Del "+M.coastYear+" al "+M.fase3Year+": ja no cal aportar, el capital sol es capitalitza.",
      [cell("Aportació",eur0(M.fase2Annual)+"/any"),
       cell("Capital als "+M.ageFire,eur0(M.capitalAtFire)),
       cell("Creixement",eur0(M.capitalAtFire-M.capitalAtCoast))]),
    fase(3,"Renda",
      "Dels "+M.ageFire+" als "+M.lifespan+" anys ("+M.yearsRetirement+" anys), vivint del capital.",
      [cell("Retirada",pct(M.swr)+"/any",eur0(M.annualWithdrawal/12)+" bruts/mes"),
       cell("Renda neta",eur0(M.monthlyNetFire)+"/mes","en € del "+(new Date(TODAY).getFullYear()+(M.ageFire-M.ageNow))),
       cell("En € d'avui",eur0(M.monthlyNetToday)+"/mes",
         M.monthlyNetToday>=M.income?"per sobre de l'objectiu":"per sota de l'objectiu")]),
  );
}

/** Els matalassos de liquiditat. L'import real surt de la cartera, no es teclegen. */
function fireLiquidity(){
  const f=S.data.fire;
  if(!f.liquidity) f.liquidity=defaultLiquidity();
  const rows=f.liquidity.map(b=>{
    const a=S.data.assets.find(x=>x.id===b.assetId);
    const actual=a?assetValue(a):0;
    const target=+b.target||0;
    const dif=actual-target;
    return {b,a,actual,target,dif};
  });
  const tot=rows.reduce((s,r)=>s+r.actual,0);
  const totT=rows.reduce((s,r)=>s+r.target,0);
  const inp=(val,on)=>el("input",{type:"number",step:"100",value:val??"",style:"text-align:right",
    onchange:e=>{on(e.target.value===""?0:+e.target.value); markDirty(); render();}});
  const assets=S.data.assets.map(a=>[a.id,a.entity+" · "+a.name]);
  return el("div",{class:"card"},
    el("h2",{},"Matalassos de liquiditat"),
    el("p",{class:"note",style:"margin:0 0 12px"},
      "L'import real de cada matalàs és el valor de l'actiu que hi has assignat, "+
      "o sigui que es posa al dia sol quan actualitzes la cartera."),
    el("div",{class:"tw"},el("table",{},
      el("thead",{},el("tr",{},["Matalàs","Actiu","Real","Objectiu","Diferència","Cobertura",""]
        .map((h,i)=>el("th",{class:i>1?"r":""},h)))),
      el("tbody",{},rows.map(r=>el("tr",{},
        el("td",{},el("input",{type:"text",value:r.b.name||"",
          onchange:e=>{r.b.name=e.target.value;markDirty();}})),
        el("td",{},sel(r.b.assetId||"",[["","— cap —"],...assets],
          v=>{r.b.assetId=v||null;markDirty();render();})),
        el("td",{class:"r num"},eur0(r.actual)),
        el("td",{class:"r"},inp(r.b.target,v=>r.b.target=v)),
        el("td",{class:"r num "+sgn(r.dif)},eur0(r.dif)),
        el("td",{class:"r num "+(r.target&&r.actual>=r.target?"pos":"neg")},
          r.target?pct(r.actual/r.target):"—"),
        el("td",{class:"r"},el("button",{class:"btn ghost",onclick:()=>{
          f.liquidity=f.liquidity.filter(x=>x!==r.b); markDirty(); render();}},"✕")),
      ))),
      el("tfoot",{},el("tr",{class:"tot"},
        ["Total","",eur0(tot),eur0(totT),eur0(tot-totT),totT?pct(tot/totT):"",""]
        .map((c,i)=>el("td",{class:i>1?"r":""},c)))),
    )),
    el("button",{class:"btn",style:"margin-top:10px",onclick:()=>{
      f.liquidity.push({name:"Nou matalàs",assetId:null,target:0}); markDirty(); render();}},
      "Afegir matalàs"),
  );
}
/** Per defecte, els actius monetaris: són els que fan de matalàs. */
function defaultLiquidity(){
  return S.data.assets.filter(a=>a.class==="Monetari"&&assetValue(a)>100)
    .map(a=>({name:a.name,assetId:a.id,target:0}));
}

const FIRE_LBL={year:"Any de Coast FIRE",monthly:"Aportació mensual",surplus:"Extra",
  rate:"Rendibilitat anual",fase2Annual:"Aportació fase 2",fase3Year:"Any d'inici fase 3",
  ageNow:"Edat actual",ageFire:"Edat de renda",income:"Renda objectiu",
  inflation:"Inflació",retRate:"Taxa de retirada",lifespan:"Esperança de vida",
  model:"Model de retirada"};
/** Canvia un paràmetre i en desa la data: així el pla té historial. */
function fireSet(k,v){
  const f=S.data.fire;
  if(f[k]===v) return;
  (f.history ??= []).push({date:TODAY,field:k,from:f[k],to:v});
  f[k]=v; markDirty(); render();
}
function fireHistory(){
  const h=(S.data.fire.history||[]).slice().reverse();
  if(!h.length) return null;
  const val=(k,v)=>{
    if(k==="model") return {growth:"Capital invertit",swr:"Regla del 4 %",hybrid:"Híbrid"}[v]||v;
    if(["year","fase3Year","ageNow","ageFire","lifespan"].includes(k)) return String(v);
    if(["rate","inflation","retRate"].includes(k))
      return new Intl.NumberFormat("ca-ES",{maximumFractionDigits:2}).format(v)+" %";
    return eur0(v);
  };
  return el("div",{class:"card"},
    el("h2",{},"Canvis de pla"),
    el("p",{class:"note",style:"margin:0 0 12px"},
      "Els paràmetres que has anat canviant, amb la data. La projecció sempre es "+
      "recalcula des d'avui i del capital real: aquesta llista és perquè sàpigues "+
      "quan vas moure el pla, no perquè el gràfic canviï d'abans."),
    el("div",{class:"tw"},el("table",{},
      el("thead",{},el("tr",{},el("th",{},"Data"),el("th",{},"Paràmetre"),
        el("th",{class:"r"},"Abans"),el("th",{class:"r"},"Després"))),
      el("tbody",{},h.slice(0,40).map(x=>el("tr",{},
        el("td",{},dCa(x.date)),
        el("td",{},FIRE_LBL[x.field]||x.field),
        el("td",{class:"r num mut"},val(x.field,x.from)),
        el("td",{class:"r num"},val(x.field,x.to))))))),
    h.length>40?el("p",{class:"note"},"Es mostren els 40 últims."):null,
  );
}
function fireParams(mes){
  const f=S.data.fire;
  const num=(k,step)=>el("input",{type:"number",step:step||"1",value:f[k]??"",
    onchange:e=>fireSet(k,e.target.value===""?0:+e.target.value)});
  const usar=(v,k)=>v==null?null:el("button",{class:"btn ghost",style:"white-space:nowrap",
    onclick:()=>fireSet(k,Math.round(v)),},"usar "+eur0(v));
  return el("div",{class:"card"},
    el("h2",{},"Paràmetres"),
    el("div",{style:"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px"},
      el("div",{},
        el("h3",{style:"font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 10px"},
          "Acumulació"),
        el("div",{class:"map"},
          lbl("Any de Coast FIRE",num("year")),
          lbl("Aportació mensual (€)",
            el("span",{style:"display:flex;gap:6px"},num("monthly","50"),
              usar(mes.invest,"monthly"))),
          lbl("Extra aquest mes (€)",num("surplus","50")),
          lbl("Rendibilitat anual (%)",num("rate","0.25")),
          lbl("Aportació fase 2 (€/any)",num("fase2Annual","500")),
          lbl("Any d'inici fase 3",num("fase3Year")),
        ),
        mes.n?el("p",{class:"note"},
          "Mesurat pels teus moviments dels últims "+mes.n+" mesos: inverteixes "+
          eur0(mes.invest)+" al mes i estalvies "+eur0(mes.saving)+"."):null,
      ),
      el("div",{},
        el("h3",{style:"font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 10px"},
          "Retirada"),
        el("div",{class:"map"},
          lbl("Edat actual",num("ageNow")),
          lbl("Edat d'inici de renda",num("ageFire")),
          lbl("Renda neta objectiu (€/mes)",num("income","50")),
          lbl("Inflació (%)",num("inflation","0.25")),
          lbl("Taxa de retirada (%)",num("retRate","0.25")),
          lbl("Esperança de vida",num("lifespan")),
          lbl("Model",sel(f.model,[
            ["growth","Capital invertit — retires el rendiment"],
            ["swr","Regla del 4 % — retirada fixa del capital inicial"],
            ["hybrid","Híbrid — renda fixa, la resta invertida"],
          ],v=>fireSet("model",v))),
        ),
      ),
    ),
    el("p",{class:"note"},
      "El capital i el cost d'adquisició surten de la pestanya Cartera: "+
      eur0(fireCapital().value)+" de valor sobre "+eur0(fireCapital().cost)+" aportats. "+
      "No es teclegen enlloc."),
  );
}

/* ================================================================== *
 *  Diàleg                                                            *
 * ================================================================== */
function dialog(title,body,buttons){
  $("#dlgTitle").textContent=title;
  $("#dlgBody").replaceChildren(body);
  $("#dlgFoot").replaceChildren(...(buttons||[]).map(([l,c,f])=>el("button",{class:c,onclick:f},l)));
  $("#dlg").showModal();
}
const closeDialog=()=>$("#dlg").close();

/* ================================================================== *
 *  Render                                                            *
 * ================================================================== */
function render(){
  for(const b of $$("nav button")) b.setAttribute("aria-current",String(b.dataset.tab===S.tab));
  for(const s of $$("main section")) s.hidden = s.id!=="tab-"+S.tab;
  const root=$("#tab-"+S.tab);
  if(!S.data){
    root.replaceChildren(el("div",{class:"card"},el("div",{class:"empty"},
      el("p",{},"Encara no hi ha dades carregades."),
      el("p",{},
        el("button",{class:"btn primary",style:"margin-right:8px",onclick:driveDialog},
          "Connectar Google Drive"),
        el("button",{class:"btn",onclick:openFile},"Obrir un fitxer")),
      el("p",{class:"note"},"Amb el Drive les dades et segueixen a tot arreu, també al "+
        "mòbil. Amb un fitxer, viuen només en aquest ordinador."),
      S.handle?el("div",{style:"margin-top:18px;padding-top:14px;border-top:1px solid var(--line)"},
        el("p",{class:"note",style:"margin:0 0 8px"},
          "L'últim fitxer que vas obrir en aquest navegador va ser ",
          el("b",{},S.handle.name),". Comprova que és el que vols: si porta un "+
          "«(2)» o «(3)» al nom, segurament és una còpia de la carpeta de baixades i "+
          "no les teves dades bones."),
        el("button",{class:"btn",style:"margin-right:8px",onclick:async()=>{
          try{
            if(await S.handle.requestPermission({mode:"readwrite"})==="granted"){
              await loadFromHandle(S.handle); marcaOrigen("fitxer",S.handle.name);
              render(); setStatus();
            }
          }catch(e){ alert("No s'ha pogut obrir: "+e.message); }
        }},"Tornar a obrir "+S.handle.name),
        el("button",{class:"btn ghost",onclick:async()=>{
          await idb.set("handle",null).catch(()=>{});
          S.handle=null; render();
          flash("Fitxer oblidat");
        }},"Oblidar-lo"),
      ):null,
      serverWrite
        ? el("p",{class:"note"},"Es desarà al PC a través del servidor.")
        : hasFS
        ? el("p",{class:"note"},"El navegador desarà directament al fitxer; només cal donar permís un cop.")
        : el("p",{class:"note"},
            location.protocol==="file:"
              ? "L'has obert amb doble clic (file://), i així Chrome no deixa desar al fitxer: "+
                "els canvis es descarregaran a la carpeta de baixades. Per desar-hi directament, "+
                "obre'l amb servir.cmd."
              : "Aquest navegador no pot escriure al fitxer: els canvis es descarreguen."),
    )));
    return;
  }
  ({resum:renderResum,moviments:renderMoviments,mesos:renderMesos,real:renderReal,
    cartera:renderCartera,rendiment:renderRendiment,fire:renderFire,
    categories:renderCategories})[S.tab](root);
}

/* ================================================================== *
 *  Arrencada                                                         *
 * ================================================================== */
$$("nav button").forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; render(); });
$("#bOpen").onclick=openFile;
$("#bSave").onclick=save;
$("#bImport").onclick=startImport;
$("#dlgX").onclick=closeDialog;
$("#bDrive").onclick=driveDialog;
$("#bHide").onclick=()=>{
  ocult=!ocult;
  try{ localStorage.setItem("finances:ocult",ocult?"1":"0"); }catch{}
  pintaOcult(); render();
};
function pintaOcult(){
  const b=$("#bHide");
  b.classList.toggle("primary",ocult);
  b.classList.toggle("ghost",!ocult);
  b.title=ocult?"Tornar a mostrar els imports":"Amagar els imports";
}
$("#bTheme").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const nxt=cur==="dark"?"light":cur==="light"?null:"dark";
  if(nxt) document.documentElement.setAttribute("data-theme",nxt);
  else document.documentElement.removeAttribute("data-theme");
  try{ localStorage.setItem("finances:theme",nxt||""); }catch{}
};
$("#filePick").onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  if(e.target.dataset.mode==="import") await handleImportFile(f);
  else loadData(JSON.parse(await f.text()));
  e.target.value="";
};
addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==="s"){ e.preventDefault(); save(); }
});
addEventListener("beforeunload",e=>{ if(S.dirty){ e.preventDefault(); e.returnValue=""; } });

if("serviceWorker" in navigator && location.protocol!=="file:"){
  addEventListener("load",()=>navigator.serviceWorker
    .register("./sw.js",{scope:"./",updateViaCache:"none"}).catch(()=>{}));
}
/* D'on han sortit les dades que tens a la pantalla. Abans no es deia enlloc, i
   això amagava el problema: si tenies un fitxer local recordat, l'app el carregava
   i ni mirava el Drive, o sigui que sempre veies la mateixa versió antiga. */
function marcaOrigen(tipus,detall){ S.origen={tipus,detall,quan:new Date()}; }

(async function boot(){
  pintaOcult();
  try{ const t=localStorage.getItem("finances:theme");
    if(t) document.documentElement.setAttribute("data-theme",t); }catch{}
  // Llegir la còpia ABANS de carregar el fitxer: carregar-lo la sobreescriu.
  const pendent=readBackup();
  await checkServer();
  loadTok();

  // 1) El Drive mana sempre: si hi tens les dades, són la versió bona.
  if(D.fileId || driveOn()){
    if(driveOn()){
      try{
        if(await driveLoad()) marcaOrigen("drive");
      }catch(e){ console.warn("Drive:",e); }
    }
    if(!S.data){
      // Hi ha dades al Drive però ara no s'hi pot arribar. Abans es carregava el
      // fitxer local en silenci i acabaves editant una còpia vella sense saber-ho.
      render(); setStatus();
      dialog("Les teves dades són al Drive",el("div",{},
        el("p",{},"La sessió de Google ha caducat, o no s'hi ha pogut connectar."),
        el("p",{class:"note"},"No es carrega res d'enlloc més per no deixar-te editant "+
          "una còpia antiga sense adonar-te'n."),
      ),[
        ["Obrir un fitxer local","btn",()=>{ closeDialog(); openFile(); }],
        ["Connectar-me al Drive","btn primary",async()=>{
          closeDialog();
          if(await driveLogin()){
            try{ if(await driveLoad()) marcaOrigen("drive"); }
            catch(e){ alert("No s'hi ha pogut llegir: "+e.message); }
            render(); setStatus();
          }
        }],
      ]);
      return;
    }
  }

  // 2) Sense Drive: el fitxer que tinguessis obert, i si no el del costat.
  if(!S.data && hasFS){
    const h=await idb.get("handle").catch(()=>null);
    if(h){
      try{
        const perm=await h.queryPermission({mode:"readwrite"});
        if(perm==="granted"){ S.handle=h; await loadFromHandle(h); marcaOrigen("fitxer",h.name); }
        else S.handle=h;   // hi és, però sense permís: s'ofereix a la pantalla d'inici
      }catch{}
    }
  }
  if(!S.data && await autoLoad()) marcaOrigen(serverWrite?"servidor":"fitxer","finances.json");
  render(); setStatus();
  offerBackup(pendent);
})();
/** Si l'última sessió va quedar amb canvis sense desar, proposa recuperar-los. */
function offerBackup(b){
  if(!b||!b.dirty||!S.data) return;
  const quan=new Date(b.savedAt);
  const nMov=b.data.movements?.length??0, nSnap=b.data.snapshots?.length??0;
  dialog("Hi ha feina sense desar",el("div",{},
    el("p",{},"L'última vegada vas deixar canvis sense desar, del ",
      el("b",{},quan.toLocaleString("ca-ES")),"."),
    el("p",{class:"note"},"La còpia té "+NF0.format(nMov)+" moviments i "+
      NF0.format(nSnap)+" valoracions. El fitxer del disc en té "+
      NF0.format(S.data.movements.length)+" i "+NF0.format(S.data.snapshots.length)+"."),
    el("p",{class:"note"},"Si la recuperes, substitueix el que s'acaba de carregar. "+
      "No es desa res al disc fins que premis Desar."),
  ),[
    ["Descartar-la","btn",()=>{ writeBackup(false); closeDialog(); }],
    ["Recuperar","btn primary",()=>{
      S.data=normalise(b.data); S.dirty=true;
      $("#bSave").disabled=false; closeDialog(); render(); setStatus();
      flash("Recuperat — prem Desar per fixar-ho al fitxer");
    }],
  ]);
}
